<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apple AI - Agentic RAG Platform</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --panel-bg: #161b22;
            --border-color: #30363d;
            --text-main: #c9d1d9;
            --text-heading: #ffffff;
            --accent-blue: #58a6ff;
            --accent-green: #3fb950;
            --user-msg-bg: #1f6feb;
            --bot-msg-bg: #21262d;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background-color: var(--panel-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 1rem 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .header-title {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text-heading);
            letter-spacing: -0.3px;
        }

        .header-subtitle {
            font-size: 0.85rem;
            color: #8b949e;
        }

        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            max-width: 900px;
            width: 100%;
            margin: 0 auto;
            padding: 1.5rem 1rem;
            overflow: hidden;
        }

        #chat-container {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            padding-right: 0.5rem;
            margin-bottom: 1rem;
        }

        .message {
            display: flex;
            flex-direction: column;
            max-width: 80%;
            padding: 0.85rem 1.1rem;
            border-radius: 10px;
            font-size: 0.95rem;
            line-height: 1.5;
            word-wrap: break-word;
        }

        .message.user {
            align-self: flex-end;
            background-color: var(--user-msg-bg);
            color: #ffffff;
            border-bottom-right-radius: 2px;
        }

        .message.assistant {
            align-self: flex-start;
            background-color: var(--bot-msg-bg);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            border-bottom-left-radius: 2px;
        }

        .badge {
            display: inline-block;
            font-size: 0.75rem;
            font-weight: 600;
            padding: 2px 8px;
            border-radius: 4px;
            margin-bottom: 6px;
            align-self: flex-start;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .badge-kb {
            background-color: rgba(88, 166, 255, 0.15);
            color: var(--accent-blue);
            border: 1px solid rgba(88, 166, 255, 0.4);
        }

        .badge-web {
            background-color: rgba(63, 185, 80, 0.15);
            color: var(--accent-green);
            border: 1px solid rgba(63, 185, 80, 0.4);
        }

        .msg-actions {
            margin-top: 8px;
            display: flex;
            gap: 8px;
        }

        .btn-audio {
            background: transparent;
            border: 1px solid var(--border-color);
            color: #8b949e;
            padding: 3px 8px;
            font-size: 0.75rem;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-audio:hover {
            color: var(--text-heading);
            border-color: #8b949e;
        }

        .input-area {
            display: flex;
            gap: 0.5rem;
            background-color: var(--panel-bg);
            padding: 0.75rem;
            border-radius: 10px;
            border: 1px solid var(--border-color);
        }

        input[type="text"] {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-heading);
            font-size: 0.95rem;
            padding: 0.4rem 0.6rem;
        }

        button.send-btn {
            background-color: var(--user-msg-bg);
            color: #ffffff;
            border: none;
            padding: 0.5rem 1.25rem;
            font-size: 0.9rem;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button.send-btn:hover {
            background-color: #388bfd;
        }

        button.send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .loading-indicator {
            display: none;
            align-self: flex-start;
            color: #8b949e;
            font-size: 0.85rem;
            padding: 0.5rem 1rem;
        }
    </style>
</head>
<body>
    <header>
        <div>
            <div class="header-title">Apple AI Platform</div>
            <div class="header-subtitle">Agentic Retrieval-Augmented Generation (RAG) System</div>
        </div>
    </header>

    <main>
        <div id="chat-container">
            <div class="message assistant">
                <span class="badge badge-kb">KNOWLEDGE BASE</span>
                Hello! I am Apple, your Agentic RAG Assistant. Ask me anything from your Knowledge Base or general live web queries.
            </div>
        </div>

        <div class="loading-indicator" id="loading">Thinking...</div>

        <div class="input-area">
            <input type="text" id="user-input" placeholder="Type your question here..." onkeydown="if(event.key==='Enter') sendMessage()">
            <button class="send-btn" id="send-btn" onclick="sendMessage()">Send</button>
        </div>
    </main>

    <script>
        const chatContainer = document.getElementById('chat-container');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        const loading = document.getElementById('loading');
        let chatHistory = [];

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            // Append user message
            appendMessage('user', text);
            userInput.value = '';
            sendBtn.disabled = true;
            loading.style.display = 'block';

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text, history: chatHistory })
                });

                if (!response.ok) {
                    const err = await response.json();
                    throw new Error(err.detail || 'Request failed');
                }

                const data = await response.json();
                loading.style.display = 'none';
                sendBtn.disabled = false;

                // Save history
                chatHistory.push({ role: 'user', content: text });
                chatHistory.push({ role: 'assistant', content: data.reply });

                // Append bot message with source badge
                appendMessage('assistant', data.reply, data.source);
            } catch (error) {
                loading.style.display = 'none';
                sendBtn.disabled = false;
                appendMessage('assistant', 'Error: ' + error.message, 'error');
            }
        }

        function appendMessage(role, text, source) {
            const msgDiv = document.createElement('div');
            msgDiv.className = 'message ' + role;

            if (role === 'assistant') {
                const badge = document.createElement('span');
                if (source === 'web') {
                    badge.className = 'badge badge-web';
                    badge.textContent = 'WEB SEARCH';
                } else {
                    badge.className = 'badge badge-kb';
                    badge.textContent = 'KNOWLEDGE BASE';
                }
                msgDiv.appendChild(badge);

                const contentDiv = document.createElement('div');
                contentDiv.textContent = text;
                msgDiv.appendChild(contentDiv);

                const actionsDiv = document.createElement('div');
                actionsDiv.className = 'msg-actions';
                
                const audioBtn = document.createElement('button');
                audioBtn.className = 'btn-audio';
                audioBtn.textContent = 'Play Audio';
                audioBtn.onclick = () => speakText(text, audioBtn);
                actionsDiv.appendChild(audioBtn);

                msgDiv.appendChild(actionsDiv);
            } else {
                msgDiv.textContent = text;
            }

            chatContainer.appendChild(msgDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function speakText(text, button) {
            if (!('speechSynthesis' in window)) {
                alert('Audio playback is not supported in this browser.');
                return;
            }
            if (window.speechSynthesis.speaking) {
                window.speechSynthesis.cancel();
                button.textContent = 'Play Audio';
                return;
            }
            const cleanText = text.replace(/\(from web\)|\(from knowledge base\)/gi, '');
            const utterance = new SpeechSynthesisUtterance(cleanText);
            utterance.onend = () => { button.textContent = 'Play Audio'; };
            utterance.onerror = () => { button.textContent = 'Play Audio'; };
            button.textContent = 'Stop Audio';
            window.speechSynthesis.speak(utterance);
        }
    </script>
</body>
</html>
